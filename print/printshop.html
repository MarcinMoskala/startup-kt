<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Startup.kt · print-shop export</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;0,800;1,400&display=swap" rel="stylesheet">
<!--
  Print-shop export: one design per page at final size INCLUDING 3 mm bleed, no marks, no margins.
    ?part=fronts  75 pages, 69 x 94 mm (card 63 x 88 + bleed), deck order, one page per printed copy
    ?part=backs   75 pages, 69 x 94 mm, the back that belongs to the front with the same page number
    ?part=boards   5 pages, 201 x 106 mm (board 195 x 100 + bleed)
    ?png=card&id=<id>&p=<players> | ?png=back&s=<1..3> | ?png=board&id=<id>   single full-bleed image for PNG export
-->
<style>
  html, body { margin:0; padding:0; background:#fff; }
  .pg { break-after: page; page-break-after: always; }
  .pg:last-child { break-after: auto; page-break-after: auto; }
  .pg svg { display:block; }
  body.png, body.png .pg { width:100vw; height:100vh; overflow:hidden; }
  body.png .pg svg { width:100vw; height:100vh; }
</style>
<style id="pagesize"></style>
</head>
<body>
<script src="cards.js"></script>
<script>
  const DATA_FILES = ['00-examples', '01-team-s1', '02-team-s23', '03-libraries', '04-features-s1-business-s3',
    '05-features-s2', '06-features-s3a', '07-features-s3b', '08-business-s12'];
  document.write(DATA_FILES.map(f => `<script src="data/${f}.js"><\/script>`).join(''));
</script>
<script src="boards.js"></script>
<script>
  document.body.insertAdjacentHTML('afterbegin', sharedDefs());
  const q = new URLSearchParams(location.search);
  const part = q.get('part'), png = q.get('png');
  const copies = sortedCards().flatMap(c => c.copies.map(p => ({ c, p })));
  const size = (w, h) => {
    document.getElementById('pagesize').textContent =
      `@page { size: ${w}mm ${h}mm; margin: 0; } .pg, .pg svg { width:${w}mm; height:${h}mm; }`;
  };
  let pages = [];
  if (png) {
    document.body.classList.add('png');
    if (png === 'card') { const c = CARDS.find(c => c.id === q.get('id')); pages = [renderCard(c, { guides: false, players: +q.get('p') || c.copies[0] })]; }
    if (png === 'back') pages = [renderBack(+q.get('s'), {})];
    if (png === 'board') pages = [renderBoard(BOARD_STARTUPS.find(s => s.id === q.get('id')), { guides: false })];
  } else if (part === 'fronts') {
    size(69, 94); pages = copies.map(({ c, p }, i) => renderCard(c, { guides: false, players: p, ns: 'f' + i }));
  } else if (part === 'backs') {
    size(69, 94); pages = copies.map(({ c }, i) => renderBack(c.sprint, { ns: 'b' + i }));
  } else if (part === 'boards') {
    size(201, 106); pages = BOARD_STARTUPS.map((s, i) => renderBoard(s, { guides: false, ns: 'd' + i }));
  }
  document.body.insertAdjacentHTML('beforeend', pages.map(s => `<div class="pg">${s}</div>`).join(''));
  // the manifest the export script reads: one line per printed card
  window.MANIFEST = copies.map(({ c, p }, i) => ({ n: i + 1, id: c.id, name: c.name, type: c.type, sprint: c.sprint, players: p }));
</script>
</body>
</html>
