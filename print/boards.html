<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Startup.kt · startup boards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root { --bg:#141517; --text:#DFE1E5; --muted:#9DA0A8; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"JetBrains Mono", monospace; }
  main { max-width: 1400px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  .toggle { margin: 0 0 20px; font-size: 12px; color: var(--muted); }
  .toggle label { cursor:pointer; }
  .gallery { display:flex; gap:32px; flex-wrap:wrap; }
  .gallery svg { width: min(100%, 640px); height:auto; display:block; filter: drop-shadow(0 12px 30px rgba(0,0,0,.5)); }
  figure { margin:0; } figcaption { color: var(--muted); font-size: 11px; margin-top: 8px; }
  .hide-guides .guide { display:none; }
  .sheet { display:none; }
  body.shot { background:#0d0d0f; }
  body.shot main { padding: 20px; max-width:none; }
  body.shot h1, body.shot p.sub, body.shot .toggle, body.shot figcaption { display:none; }
  body.shot .gallery svg { width:1560px; border-radius:18px; filter:none; }
  @media print {
    /* Cut-ready A4: 2 boards per page, each with 3 mm bleed (201 x 106 mm), crop marks at the 195 x 100 mm trim. Print at 100%. */
    @page { size: A4 portrait; margin: 0; }
    body { background:#fff; }
    main { display:none; }
    .sheet { display:block; }
    .page { position:relative; width:210mm; height:297mm; overflow:hidden; break-after: page; page-break-after: always; }
    .page:last-child { break-after: auto; page-break-after: auto; }
    .page .board { position:absolute; left:4.5mm; width:201mm; height:106mm; display:block; }
    .marks { position:absolute; left:0; top:0; width:210mm; height:297mm; }
  }
</style>
</head>
<body>
<main>
  <h1>Startup.kt · startup boards</h1>
  <p class="sub">195 × 100 mm + 3 mm bleed. Cmd/Ctrl+P prints 2 boards per A4 page at 1:1 trim size (no bleed, hairline cut lines). Roadmap slots are 63 mm wide, one card each.</p>
  <div class="toggle"><label><input type="checkbox" id="g" checked> show trim (red) and safe zone (blue)</label></div>
  <div class="gallery" id="gallery"></div>
</main>
<div class="sheet" id="sheet"></div>

<script src="cards.js"></script>
<script src="boards.js"></script>
<script>
  document.body.insertAdjacentHTML('afterbegin', sharedDefs());
  const params = new URLSearchParams(location.search);
  const shot = params.get('shot');
  const all = BOARD_STARTUPS;
  const list = shot ? all.filter(s => s.id === shot) : all;
  if (shot) document.body.classList.add('shot');
  document.getElementById('gallery').innerHTML = list.map(s =>
    `<figure>${renderBoard(s, { guides: !shot })}<figcaption>${s.id}</figcaption></figure>`).join('');
  if (shot) document.querySelectorAll('.gallery svg').forEach(s => s.setAttribute('viewBox', '3 3 195 100'));
  const pages = [];
  for (let i = 0; i < all.length; i += 2) pages.push(all.slice(i, i + 2));
  // Boards (with bleed) at top 32.5 mm and 158.5 mm; trims at x 7.5..202.5, y 35.5..135.5 and 161.5..261.5.
  const TOPS = [32.5, 158.5];
  const marks = n => {
    const l = (x1, y1, x2, y2) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
    let s = '';
    TOPS.slice(0, n).forEach(t => {
      const y1 = t + 3, y2 = t + 103;
      [7.5, 202.5].forEach(x => { s += l(x, t - 8, x, t - 1.5) + l(x, t + 107.5, x, t + 114); });
      [y1, y2].forEach(y => { s += l(0.5, y, 3.5, y) + l(206.5, y, 209.5, y); });
    });
    return `<svg class="marks" viewBox="0 0 210 297" xmlns="http://www.w3.org/2000/svg"><g stroke="#000" stroke-width=".2">${s}</g>` +
      `<text x="105" y="290" font-size="2.2" font-family="JetBrains Mono, monospace" fill="#888" text-anchor="middle">Startup.kt · boards 195 × 100 mm · print at 100% · cut on the marks</text></svg>`;
  };
  document.getElementById('sheet').innerHTML = pages.map(p =>
    `<div class="page">${p.map((s, i) => renderBoard(s, { guides: false, ns: 'p' }).replace('<svg ', `<svg class="board" style="top:${TOPS[i]}mm" `)).join('')}${marks(p.length)}</div>`).join('');
  document.getElementById('g').addEventListener('change', e =>
    document.body.classList.toggle('hide-guides', !e.target.checked));
</script>
</body>
</html>
